<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Gerador de senha</title>
    <link rel="stylesheet" href="css/style.css">

<body>

            <p id="password">
               
            </p>

        </div>
        <div id="pass">
            <div class="box">
                <input type="number" max="10" id="inCaracters" value="check">

            </div>
            <div class="box">    
                <input class="bitChek" type="checkbox" id="inMaiuscula">

            </div>
            <div class="box">    
                <input class="bitChek" type="checkbox" id="inMinuscula">
                <label for="minuscula"> Incluir letra minuscula</label>
            </div>
            <div class="box">    
                <input type="checkbox" id="inNumber">
                <label for="number"> Incluir number</label>
            </div>
            <div class="box">
                <input type="checkbox" id="inEspeciais">
                <label for="especial"> Incluir caractere especial</label>
            </div>
                <button id="submit">
                    Gerar senha
                </button>
            </form>
        </div>
    </div>
